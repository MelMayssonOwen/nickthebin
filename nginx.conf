# Nick the Bin — nginx site config (served from conf.d, i.e. inside http{})

# Anonymise the visitor IP (mask the last octet) for privacy/GDPR.
map $remote_addr $anon_ip {
    ~(?<ip4>\d+\.\d+\.\d+)\.\d+   $ip4.0;
    default                       0.0.0.0;
}
# COMBINED-shaped log with the anonymised IP — GoAccess parses this directly.
log_format anon '$anon_ip - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    listen 3000;            # Coolify's proxy routes here
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /data/access.log anon;           # persistent volume — survives redeploys
    access_log /dev/stdout anon;                 # also visible in Coolify logs

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Umami first-party analytics proxy (self-hosted, same Coolify box, reached
    # via Traefik on its internal sslip host). Public — no auth — this is what
    # visitors' browsers call. Mirrors the pattern already live on
    # clefdrills.com (clef/web/server.js proxyUmami) and other portfolio sites.
    location = /stats/script.js {
        proxy_pass http://umami-odw2g9a9zepk7psg8ka1yr5d.74.208.18.72.sslip.io/script.js;
        proxy_set_header Host umami-odw2g9a9zepk7psg8ka1yr5d.74.208.18.72.sslip.io;
        proxy_set_header User-Agent $http_user_agent;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /stats/api/send {
        proxy_pass http://umami-odw2g9a9zepk7psg8ka1yr5d.74.208.18.72.sslip.io/api/send;
        proxy_set_header Host umami-odw2g9a9zepk7psg8ka1yr5d.74.208.18.72.sslip.io;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # GoAccess traffic dashboard (basic-auth protected) — moved off /stats/ to
    # /goaccess/ so that path is free for the public Umami proxy above.
    location = /goaccess { return 301 /goaccess/; }
    location /goaccess/ {
        auth_basic "Nick the Bin — goaccess";
        auth_basic_user_file /etc/nginx/.htpasswd;
        index index.html;
    }
}
