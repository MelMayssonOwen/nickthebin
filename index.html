<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nick the Bin</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; background: #0b0b0f;
      overflow: hidden; display: flex; align-items: center; justify-content: center;

      display: block; background: #3f9fe6;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- dependency-free: no CDN, no fonts. order matters. -->
  <script src="src/audio.js"></script>
  <script src="src/font.js"></script>
  <script src="src/boss-pixels.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
