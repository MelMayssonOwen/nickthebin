<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UK POLICE — No Nonsense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0b0b0f; overflow: hidden;
      font-family: 'Press Start 2P', monospace;

    #game { width: 100vw; height: 100vh; }
    #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    #hint {
      position: fixed; bottom: 6px; left: 0; right: 0; text-align: center;
      color: #56606e; font-size: 9px; letter-spacing: 1px; pointer-events: none;
    }

  <div id="game"></div>
  <div id="hint">← → MOVE · ↑ JUMP · SPACE BIN/BASH</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="src/audio.js"></script>

  <script src="src/world.js"></script>
  <script src="src/ui.js"></script>

</html>
