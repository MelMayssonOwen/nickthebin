<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nick the Bin</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; background: #0b0b0f;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    #game { line-height: 0; }
    #game canvas {
      image-rendering: pixelated; image-rendering: crisp-edges;
      display: block; background: #3f9fe6;
    }
    #disclaimer {
      position: fixed; left: 0; right: 0; bottom: 2px;
      text-align: center; font-family: monospace; font-size: 9px;
      color: #8a9098; opacity: 0.55; letter-spacing: 0.3px;
      pointer-events: none; user-select: none; z-index: 40;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="disclaimer">Fictional · satirical · not affiliated with any person or force.</div>

  <!-- dependency-free: no CDN, no fonts. order matters. -->
  <script src="src/audio.js"></script>
  <script src="src/font.js"></script>
  <script src="src/boss-pixels.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
